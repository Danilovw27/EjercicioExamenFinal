name: Destroy EC2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DESTROY para confirmar la eliminacion del stack'
        required: true
        default: ''

jobs:

  destroy:

    runs-on: ubuntu-latest

    steps:

      - name: Validar confirmacion
        if: ${{ github.event.inputs.confirm != 'DESTROY' }}
        run: |
          echo "❌ Confirmacion invalida. Debes escribir exactamente: DESTROY"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verificar que el stack existe
        id: check_stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name ec2-stack-clase \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "STACK_NOT_FOUND")

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" = "STACK_NOT_FOUND" ]; then
            echo "⚠️  El stack ec2-stack-clase no existe. Nada que eliminar."
            exit 0
          fi

          echo "✅ Stack encontrado con estado: $STATUS"

      - name: Eliminar CloudFormation Stack
        if: ${{ steps.check_stack.outputs.status != 'STACK_NOT_FOUND' }}
        run: |
          echo "🗑️  Eliminando stack ec2-stack-clase..."

          aws cloudformation delete-stack \
            --stack-name ec2-stack-clase

          echo "⏳ Esperando a que el stack sea eliminado..."

          aws cloudformation wait stack-delete-complete \
            --stack-name ec2-stack-clase

          echo "✅ Stack eliminado exitosamente."
